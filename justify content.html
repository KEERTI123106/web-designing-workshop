<html>
    <head>
        <title>
        justify content {alignment of box on screen}
        </title>
    </head>
    <body>
      <span style="display: flex;justify-content: flex-start;">
        <span style="background-color: brown; border: 2px solid black;">BOX 1</span>
        <span style="background-color: palevioletred; border: 2px solid black;">BOX 2</span>
        <span style="background-color: peru; border: 2px solid black;">BOX 3</span>
      </span>

      <span style="display: flex;justify-content: flex-end;">
        <span style="background-color: brown;  border: 2px dashed black;">BOX 1</span>
        <span style="background-color: palevioletred;  border: 2px dashed black;">BOX 2</span>
        <span style="background-color: peru;  border: 2px dashed black;">BOX 3</span>
      </span>

      <span style="display: flex;justify-content: center;">
        <span style="background-color: brown;  border: 2px dotted black;">BOX 1</span>
        <span style="background-color: palevioletred;  border: 2px dotted black;">BOX 2</span>
        <span style="background-color: peru;  border: 2px dotted black;">BOX 3</span>
      </span>

      <span style="display: flex;justify-content: space-between; border: 3px dotted black;">
        <span style="background-color: brown;  border: 2px dotted black;">BOX 1</span>
        <span style="background-color: palevioletred;  border: 2px dotted black;">BOX 2</span>
        <span style="background-color: peru;  border: 2px dotted black;">BOX 3</span>
      </span>
<br> <br> 

      <span style="display: flex;justify-content: space-around; border: 3px dotted black;">
        <span style="background-color: brown;  border: 2px dotted black;">BOX 1</span>
        <span style="background-color: palevioletred;  border: 2px dotted black;">BOX 2</span>
        <span style="background-color: peru;  border: 2px dotted black;">BOX 3</span>
      </span>
  <br> <br>

      <span style="display: flex;justify-content: space-evenly; border: 3px dotted black;">
        <span style="background-color: brown;  border: 2px dotted black;">BOX 1</span>
        <span style="background-color: palevioletred;  border: 2px dotted black;">BOX 2</span>
        <span style="background-color: peru;  border: 2px dotted black;">BOX 3</span>
      </span>


    </body>
</html>
