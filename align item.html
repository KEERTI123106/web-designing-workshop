
<html>
<head>
    <title>Align-Item</title>
</head>
<body>
 <div style="display: flex;align-items: center; width: 100px; height: 100px;">
   <div style="background-color: peru;">BOX A</div>
   <div style="background-color: blueviolet;">BOX B</div>
   <div style="background-color: pink;">BOX C</div> 
 </div>

 <div style="display: flex;align-items: flex-end; width: 100px; height: 100px;">
   <div style="background-color: peru;">BOX A</div>
   <div style="background-color: blueviolet;">BOX B</div>
   <div style="background-color: pink;">BOX C</div> 
 </div>
<br> <br> <br>
 <div style="display: flex;align-items: flex-start; width: 100px; height: 100px;">
   <div style="background-color: peru;">BOX A</div>
   <div style="background-color: blueviolet;">BOX B</div>
   <div style="background-color: pink;">BOX C</div> 
 </div>

 <div style="display: flex;align-items: stretch; width: 100px; height: 100px;">
   <div style="background-color: peru;">BOX A</div>
   <div style="background-color: blueviolet;">BOX B</div>
   <div style="background-color: pink;">BOX C</div> 
 </div>
</body>
</html>
